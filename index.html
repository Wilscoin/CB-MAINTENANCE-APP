:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#082e68,#1257b8 65%,#5b9cff);display:flex;align-items:center;justify-content:center;padding:18px}.authcard{width:min(440px,100%);background:white;border-radius:20px;padding:28px;box-shadow:0 24px 80px #001b3c55}.authbrand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.authlogo{width:50px;height:50px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font-size:25px;font-weight:bold}.authcard h2{margin:0 0 7px;color:var(--deep)}.authcard p{color:var(--muted);font-size:13px;line-height:1.5}.authcard .field{margin:13px 0}.authcard .primary{width:100%;padding:12px}.authmsg{background:#edf5ff;border:1px solid #d5e6ff;color:#28558d;border-radius:9px;padding:10px;font-size:12px;margin:12px 0}.toast{position:fixed;bottom:15px;right:15px;background:#123e7d;color:white;padding:12px 16px;border-radius:10px;z-index:20}.foot{text-align:center;padding:22px;color:#8490a2;font-size:11px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;position:sticky;top:72px;z-index:2;border-right:0;border-bottom:1px solid var(--line);padding:6px}.nav{white-space:nowrap;width:auto;padding:10px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}main{padding:14px}}@media(max-width:520px){.top{padding:10px}.brand h1{font-size:15px}.logo{width:34px;height:34px}.top select,.top button{font-size:11px;padding:7px}.cards{gap:8px}.card{padding:12px}.metric{font-size:24px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head h2{font-size:22px}.nav{font-size:12px}.nav .icon{display:none}}
</style></head><body><header class="top"><div class="brand"><div class="logo">M</div><div><h1>MAINTENANCE</h1><small>Fleet • Workshop • Lubricants</small></div></div><div style="display:flex;gap:7px;align-items:center"><span id="userLabel" style="font-size:12px">Signed out</span><button id="exportAll">Export</button><button id="logout" title="Sign out">Sign out</button></div></header><div class="layout"><aside id="nav"><button class="nav active" data-page="dashboard">▦ Dashboard</button><button class="nav" data-page="fleet">🚜 Fleet Register</button><button class="nav" data-page="jobs">🔧 Maintenance Jobs</button><button class="nav" data-page="services">◷ Service Schedule</button><button class="nav" data-page="oil">◉ Oil Consumption</button><button class="nav" data-page="stock">▤ Stock & Parts</button><button class="nav" data-page="checks">☑ Daily Checklist</button><button class="nav" data-page="members" id="membersNav">👥 Members</button><button class="nav" data-page="settings">⚙ Settings</button></aside><main id="main"></main></div><div class="foot">MAINTENANCE • Blue edition • Local-first starter app</div><div class="modalback" id="back"><div class="modal"><div class="modalhead"><h3 id="mtitle">Add record</h3><button class="soft" id="close">✕</button></div><div id="mbody"></div></div></div><div id="toast" class="toast hidden"></div>
<div id="authScreen" class="authscreen"><div class="authcard"><div class="authbrand"><div class="authlogo">M</div><div><h2>MAINTENANCE</h2><p style="margin:3px 0">Fleet and workshop management</p></div></div><div id="authContent"></div></div></div>
<script>
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const seed={fleet:[{id:id(),no:'BD-24',type:'Bulldozer',make:'CAT',model:'D6',site:'Moniya',mt:'Hours',meter:1120,last:1000,status:'Working'},{id:id(),no:'EX-81',type:'Excavator',make:'CAT',model:'',site:'Airport',mt:'Hours',meter:2380,last:2250,status:'Working'},{id:id(),no:'TT-150',type:'Tipper Truck',make:'',model:'',site:'Moniya',mt:'KM',meter:148500,last:144000,status:'Working'},{id:id(),no:'PU-263',type:'Pickup',make:'',model:'',site:'Lalupon',mt:'KM',meter:68200,last:64000,status:'Working'}],jobs:[{id:id(),date:today(),no:'VR-119',site:'Moniya',fault:'Steering pump issue',priority:'High',assigned:'Workshop team',status:'In Progress'}],oil:[{id:id(),date:today(),no:'BD-24',site:'Moniya',type:'Engine oil 15W-40',litres:5,meter:1120,reason:'Top-up',by:'Administrator'}],stock:[{id:id(),item:'Engine oil 15W-40',cat:'Lubricant',unit:'L',opening:500,received:0,issued:0,min:100},{id:id(),item:'Hydraulic oil 68',cat:'Lubricant',unit:'L',opening:300,received:0,issued:0,min:60},{id:id(),item:'P554620 filter',cat:'Filter',unit:'pcs',opening:0,received:0,issued:0,min:2}],checks:[],settings:{time:'06:00'}};let data;try{data=JSON.parse(localStorage.getItem('maintenance_v1'))||seed}catch(e){data=seed}let page='dashboard',role='Viewer',currentUser=null;let users=JSON.parse(localStorage.getItem('maintenance_users')||'[]');function save(){localStorage.setItem('maintenance_v1',JSON.stringify(data))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}function pill(s,c=''){return `<span class="pill ${c}">${esc(s)}</span>`}function due(f){return f.meter-f.last>=(f.mt==='KM'?5000:250)}function bal(s){return +s.opening + +s.received - +s.issued}function btn(t,a,c='soft'){return `<button class="${c}" data-a="${a}">${t}</button>`}function head(t,s,b=''){return `<div class="head"><div><h2>${t}</h2><p>${s}</p></div>${b}</div>`}function table(h,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty">No records yet. Add a record to get started.</div>'}function field(l,n,v='',type='text',opts){return `<div class="field"><label>${l}</label>${opts?`<select name="${n}">${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input name="${n}" type="${type}" value="${esc(v)}" required>`}</div>`}function area(l,n){return `<div class="field full"><label>${l}</label><textarea name="${n}"></textarea></div>`}function form(fields,saveText,cb){$('#mbody').innerHTML=`<form id="form"><div class="formgrid">${fields}</div><div class="actions"><button type="button" class="soft" id="cancel">Cancel</button><button class="primary">${saveText}</button></div></form>`;$('#back').classList.add('open');$('#cancel').onclick=close;$('#form').onsubmit=e=>{e.preventDefault();cb(new FormData(e.target));close();save();render();toast('Record saved')}}function modal(t,fields,saveText,cb){$('#mtitle').textContent=t;form(fields,saveText,cb)}function close(){$('#back').classList.remove('open')}$('#close').onclick=close;$('#back').onclick=e=>{if(e.target.id==='back')close()};function addFleet(){if(role==='Viewer')return toast('Viewer cannot edit');modal('Add equipment',field('Fleet number','no')+field('Equipment type','type','Bulldozer','text',['Bulldozer','Excavator','Tipper Truck','Grader','Roller','Backhoe Loader','Pickup','Generator','Crane','Other'])+field('Make','make')+field('Model','model')+field('Site','site','Moniya')+field('Meter type','mt','Hours','text',['Hours','KM'])+field('Current meter','meter','0','number')+field('Last service meter','last','0','number')+field('Status','status','Working','text',['Working','Under Repair','Stopped','Standby']),'Add equipment',f=>data.fleet.push({id:id(),no:f.get('no'),type:f.get('type'),make:f.get('make'),model:f.get('model'),site:f.get('site'),mt:f.get('mt'),meter:+f.get('meter'),last:+f.get('last'),status:f.get('status')}))}function addJob(){if(role==='Viewer')return toast('Viewer cannot edit');modal('Log maintenance job',field('Date','date',today(),'date')+field('Fleet number','no',data.fleet[0]?.no||'','text',data.fleet.map(f=>f.no))+field('Site','site','Moniya')+field('Priority','priority','Normal','text',['Low','Normal','High','Critical'])+field('Assigned to','assigned')+field('Status','status','Open','text',['Open','In Progress','Waiting for Parts','Completed'])+area('Fault / work required','fault'),'Save job',f=>data.jobs.unshift({id:id(),date:f.get('date'),no:f.get('no'),site:f.get('site'),priority:f.get('priority'),assigned:f.get('assigned'),status:f.get('status'),fault:f.get('fault')}))}function addOil(){if(role==='Viewer')return toast('Viewer cannot edit');modal('Record oil consumption',field('Date','date',today(),'date')+field('Fleet number','no',data.fleet[0]?.no||'','text',data.fleet.map(f=>f.no))+field('Site','site','Moniya')+field('Oil type','type','Engine oil 15W-40','text',['Engine oil 15W-40','Engine oil SAE 40','Engine oil SAE 30','Hydraulic oil 68','Hydraulic oil 32','Transmission oil','Gear oil 85W-90','ATF','Other'])+field('Quantity (litres)','litres','1','number')+field('Meter HR/KM','meter','0','number')+field('Reason','reason','Top-up','text',['Top-up','Leak / consumption','Oil change','Repair refill','Other'])+field('Entered by','by',role)+area('Notes','notes'),'Save oil record',f=>data.oil.unshift({id:id(),date:f.get('date'),no:f.get('no'),site:f.get('site'),type:f.get('type'),litres:+f.get('litres'),meter:+f.get('meter'),reason:f.get('reason'),by:f.get('by')}))}function addStock(){if(role==='Viewer')return toast('Viewer cannot edit');modal('Add stock item',field('Item name','item')+field('Category','cat','Lubricant','text',['Lubricant','Filter','Spare Part','Consumable','Other'])+field('Unit','unit','L','text',['L','pcs','drum','box','set'])+field('Opening balance','opening','0','number')+field('Received','received','0','number')+field('Issued','issued','0','number')+field('Minimum stock','min','0','number'),'Save item',f=>data.stock.unshift({id:id(),item:f.get('item'),cat:f.get('cat'),unit:f.get('unit'),opening:+f.get('opening'),received:+f.get('received'),issued:+f.get('issued'),min:+f.get('min')}))}function addCheck(){if(role==='Viewer')return toast('Viewer cannot edit');modal('Daily pre-start checklist',field('Date','date',today(),'date')+field('Fleet number','no',data.fleet[0]?.no||'','text',data.fleet.map(f=>f.no))+field('Meter reading','meter','0','number')+field('Engine oil','engine','OK','text',['OK','Low','Leak','N/A'])+field('Hydraulic oil','hyd','OK','text',['OK','Low','Leak','N/A'])+field('Grease','grease','OK','text',['OK','Low','Required','N/A'])+field('Water/coolant','water','OK','text',['OK','Low','Leak','N/A'])+field('Air filter','air','OK','text',['OK','Dirty','Clean/Replace','N/A'])+field('Radiator','radiator','OK','text',['OK','Dirty','Leak','N/A'])+field('Belt','belt','OK','text',['OK','Loose','Damaged','N/A'])+field('Inspected by','by',role)+area('Defects / remarks','remarks'),'Submit checklist',f=>data.checks.unshift({id:id(),date:f.get('date'),no:f.get('no'),meter:+f.get('meter'),engine:f.get('engine'),hyd:f.get('hyd'),grease:f.get('grease'),water:f.get('water'),air:f.get('air'),radiator:f.get('radiator'),belt:f.get('belt'),by:f.get('by'),remarks:f.get('remarks')}))}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let m=$('#main');if(page==='dashboard'){let dueN=data.fleet.filter(due).length,open=data.jobs.filter(j=>j.status!=='Completed').length,oil=data.oil.filter(o=>o.date===today()).reduce((s,o)=>s+o.litres,0);m.innerHTML=head('Dashboard','Fleet condition, service due, workshop jobs and oil consumption')+`<div class="cards"><div class="card"><div class="label">Fleet registered</div><div class="metric">${data.fleet.length}</div><div class="label">Equipment and vehicles</div></div><div class="card"><div class="label">Service due</div><div class="metric">${dueN}</div><div class="label">Based on current meter</div></div><div class="card"><div class="label">Open jobs</div><div class="metric">${open}</div><div class="label">Not completed</div></div><div class="card"><div class="label">Oil recorded today</div><div class="metric">${oil} L</div><div class="label">Daily oil entries</div></div></div><div class="grid2"><section class="panel"><div class="panelhead"><h3>Oil use — last 7 days</h3>${btn('+ Record oil','oiladd','primary')}</div><div class="chart"><canvas id="chart"></canvas></div></section><section class="panel"><h3>Equipment requiring service</h3>${table(['Fleet','Site','Meter','Alert'],data.fleet.filter(due).map(f=>`<tr><td><b>${esc(f.no)}</b></td><td>${esc(f.site)}</td><td>${f.meter} ${f.mt==='KM'?'km':'hr'}</td><td>${pill('SERVICE DUE','bad')}</td></tr>`))}</section></div><section class="panel" style="margin-top:14px"><h3>Recent jobs</h3>${table(['Date','Fleet','Fault','Priority','Assigned','Status'],data.jobs.slice(0,6).map(j=>`<tr><td>${j.date}</td><td>${esc(j.no)}</td><td>${esc(j.fault)}</td><td>${pill(j.priority,j.priority==='High'||j.priority==='Critical'?'bad':'')}</td><td>${esc(j.assigned)}</td><td>${pill(j.status,j.status==='Completed'?'good':'warn')}</td></tr>`))}</section>`}else if(page==='fleet'){m.innerHTML=head('Fleet Register','Manage equipment, site, meter readings and condition.',btn('+ Add equipment','fleetadd','primary'))+`<div class="toolbar"><input id="search" placeholder="Search fleet, type, site"><select id="statusFilter"><option>All status</option><option>Working</option><option>Under Repair</option><option>Stopped</option><option>Standby</option></select></div><div id="tbl">${fleetTable(data.fleet)}</div>`}else if(page==='jobs'){m.innerHTML=head('Maintenance Jobs','Log faults and follow repairs to completion.',btn('+ Log job','jobadd','primary'))+table(['Date','Fleet / Site','Fault','Priority','Assigned','Status'],data.jobs.map(j=>`<tr><td>${j.date}</td><td><b>${esc(j.no)}</b><br>${esc(j.site)}</td><td>${esc(j.fault)}</td><td>${pill(j.priority,j.priority==='High'||j.priority==='Critical'?'bad':'')}</td><td>${esc(j.assigned)}</td><td><select data-status="${j.id}">${['Open','In Progress','Waiting for Parts','Completed'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`)}</select></td></tr>`))}else if(page==='services'){m.innerHTML=head('Service Schedule','Machines every 250 operating hours • Trucks every 5,000 km')+`<div class="notice">Keep the current meter and last service meter updated. The app calculates usage since service and flags due equipment.</div>`+table(['Fleet','Type','Site','Current meter','Last service','Interval','Remaining / overdue','Status','Action'],data.fleet.map(f=>{let interval=f.mt==='KM'?5000:250,rem=interval-(f.meter-f.last);return `<tr><td><b>${esc(f.no)}</b></td><td>${esc(f.type)}</td><td>${esc(f.site)}</td><td>${f.meter} ${f.mt==='KM'?'km':'hr'}</td><td>${f.last}</td><td>${interval} ${f.mt==='KM'?'km':'hr'}</td><td>${rem>=0?rem+' left':Math.abs(rem)+' overdue'}</td><td>${due(f)?pill('DUE','bad'):pill('On schedule','good')}</td><td>${btn('Update meter','meter:'+f.id)}</td></tr>`}))}else if(page==='oil'){m.innerHTML=head('Oil Consumption','Daily oil records and trend chart.',btn('+ Record oil','oiladd','primary'))+`<div class="cards"><div class="card"><div class="label">All recorded oil</div><div class="metric">${data.oil.reduce((s,o)=>s+(+o.litres||0),0)} L</div></div><div class="card"><div class="label">Entries today</div><div class="metric">${data.oil.filter(o=>o.date===today()).length}</div></div><div class="card"><div class="label">Fleet recorded</div><div class="metric">${new Set(data.oil.map(o=>o.no)).size}</div></div><div class="card"><div class="label">Oil types</div><div class="metric">${new Set(data.oil.map(o=>o.type)).size}</div></div></div><section class="panel" style="margin-bottom:14px"><h3>Daily oil consumption (litres)</h3><div class="chart"><canvas id="chart"></canvas></div></section><div class="toolbar"><input id="oilsearch" placeholder="Search fleet, oil type, site"><input id="oildate" type="date"></div><div id="oiltable">${oilTable(data.oil)}</div>`}else if(page==='stock'){m.innerHTML=head('Stock & Parts','Lubricant/spare-parts balance and low-stock alerts.',btn('+ Add stock item','stockadd','primary'))+`<div class="notice">Balance = opening + received − issued. Record all movements consistently.</div>`+table(['Item','Category','Unit','Opening','Received','Issued','Balance','Minimum','Status'],data.stock.map(s=>`<tr><td>${esc(s.item)}</td><td>${esc(s.cat)}</td><td>${s.unit}</td><td>${s.opening}</td><td>${s.received}</td><td>${s.issued}</td><td><b>${bal(s)}</b></td><td>${s.min}</td><td>${bal(s)<=s.min?pill('LOW STOCK','bad'):pill('Available','good')}</td></tr>`))}else if(page==='checks'){m.innerHTML=head('Daily Checklist','Record pre-start inspection and defects.',btn('+ New checklist','checkadd','primary'))+`<div class="notice">Check engine oil, hydraulic oil, grease, water/coolant, air filter, radiator and belt before equipment is used.</div>`+table(['Date','Fleet','Meter','Engine oil','Hydraulic','Grease','Water','Air filter','Radiator','Belt','Inspected by','Remarks'],data.checks.map(c=>`<tr><td>${c.date}</td><td>${esc(c.no)}</td><td>${c.meter}</td><td>${pill(c.engine)}</td><td>${pill(c.hyd)}</td><td>${pill(c.grease)}</td><td>${pill(c.water)}</td><td>${pill(c.air)}</td><td>${pill(c.radiator)}</td><td>${pill(c.belt)}</td><td>${esc(c.by)}</td><td>${esc(c.remarks)}</td></tr>`))}else if(page==='members'){if(role!=='Administrator'){m.innerHTML=head('Members','Account management')+'<div class="notice">Only an Administrator can manage user accounts.</div>'}else{m.innerHTML=head('Users & Members','Create individual logins and assign access roles.',btn('+ Add member','memberadd','primary'))+`<div class="notice">Accounts in this starter version are stored in this browser only. They are not yet shared across devices. For company use, connect secure hosted authentication and a shared database.</div>`+table(['Name','Username','Role','Created','Action'],users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${pill(u.role)}</td><td>${esc(u.created||'—')}</td><td>${u.id===currentUser?.id?pill('Signed in','good'):btn('Delete','memberdel:'+u.id,'danger')}</td></tr>`))}}else if(page==='settings'){m.innerHTML=head('Settings','Daily reminder and local backup options')+`<section class="panel"><h3>Daily reminder</h3><form id="settings"><div class="formgrid">${field('Reminder time','time',data.settings.time||'06:00','time')}</div><div class="actions"><button class="primary">Save setting</button><button type="button" class="soft" id="notify">Enable browser notification</button></div></form><div class="notice" style="margin-top:14px">The 6:00 AM reminder can be scheduled in this app, but reliable notifications when the app is closed require hosting and a push-notification service. Data is currently saved in this browser only, not shared between devices.</div><h3>Backup / restore</h3><p>Download a JSON backup regularly before changing device or browser.</p>${btn('Download full backup','backup')} <button class="danger" id="restore">Restore backup</button></section>`}bind();drawChart()}
function fleetTable(list){return table(['Fleet','Equipment','Make/model','Site','Current meter','Last service','Service','Condition','Action'],list.map(f=>`<tr><td><b>${esc(f.no)}</b></td><td>${esc(f.type)}</td><td>${esc(f.make+' '+f.model)}</td><td>${esc(f.site)}</td><td>${f.meter} ${f.mt==='KM'?'km':'hr'}</td><td>${f.last}</td><td>${due(f)?pill('DUE','bad'):pill('Not due','good')}</td><td>${pill(f.status,f.status==='Working'?'good':'warn')}</td><td>${btn('Update meter','meter:'+f.id)}</td></tr>`))}function oilTable(list){return table(['Date','Fleet','Site','Oil type','Litres','Meter','Reason','Entered by'],list.map(o=>`<tr><td>${o.date}</td><td>${esc(o.no)}</td><td>${esc(o.site)}</td><td>${esc(o.type)}</td><td>${o.litres}</td><td>${o.meter}</td><td>${esc(o.reason)}</td><td>${esc(o.by)}</td></tr>`))}
function bind(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let a=b.dataset.a;if(a==='fleetadd')addFleet();if(a==='jobadd')addJob();if(a==='oiladd')addOil();if(a==='stockadd')addStock();if(a==='checkadd')addCheck();if(a==='memberadd')addMember();if(a.startsWith('memberdel:'))deleteMember(a.slice(10));if(a.startsWith('meter:')){let f=data.fleet.find(x=>x.id===a.slice(6));if(!f)return;modal('Update meter and service',field('Fleet number','no',f.no)+field('Current meter','meter',f.meter,'number')+field('Last service meter','last',f.last,'number')+field('Status','status',f.status,'text',['Working','Under Repair','Stopped','Standby']),'Update',d=>{f.meter=+d.get('meter');f.last=+d.get('last');f.status=d.get('status')})}if(a==='backup')backup()});document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{if(role==='Viewer'){toast('Viewer cannot edit');render();return}let j=data.jobs.find(x=>x.id===s.dataset.status);if(j){j.status=s.value;save();toast('Job status updated')}});if($('#search')){let f=()=>{$('#tbl').innerHTML=fleetTable(data.fleet.filter(x=>(x.no+' '+x.type+' '+x.site).toLowerCase().includes($('#search').value.toLowerCase())&&($('#statusFilter').value==='All status'||x.status===$('#statusFilter').value)));bind()};$('#search').oninput=f;$('#statusFilter').onchange=f}if($('#oilsearch')){let f=()=>{$('#oiltable').innerHTML=oilTable(data.oil.filter(x=>(x.no+' '+x.type+' '+x.site).toLowerCase().includes($('#oilsearch').value.toLowerCase())&&(!$('#oildate').value||x.date===$('#oildate').value)));};$('#oilsearch').oninput=f;$('#oildate').onchange=f}if($('#settings'))$('#settings').onsubmit=e=>{e.preventDefault();data.settings.time=new FormData(e.target).get('time');save();toast('Reminder time saved')};if($('#notify'))$('#notify').onclick=()=>{if(!('Notification'in window))return toast('Notifications not supported');Notification.requestPermission().then(p=>toast('Notification permission: '+p))};if($('#restore'))$('#restore').onclick=restore}
function drawChart(){let c=$('#chart');if(!c)return;let r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let w=r.width,h=r.height,days=[];for(let i=6;i>=0;i--){let dt=new Date();dt.setDate(dt.getDate()-i);days.push(dt.toISOString().slice(0,10))}let vals=days.map(day=>data.oil.filter(o=>o.date===day).reduce((s,o)=>s+(+o.litres||0),0)),max=Math.max(5,...vals),left=34,top=14,ph=h-43,pw=w-left-8;x.font='11px Arial';for(let i=0;i<=4;i++){let y=top+ph*i/4;x.strokeStyle='#e1e8f2';x.beginPath();x.moveTo(left,y);x.lineTo(w-6,y);x.stroke();x.fillStyle='#697991';x.fillText(Math.round(max*(1-i/4)),2,y+4)}vals.forEach((v,i)=>{let bw=Math.min(30,pw/10),xx=left+(i+.5)*pw/7-bw/2,bh=ph*v/max;x.fillStyle='#1257b8';x.fillRect(xx,top+ph-bh,bw,bh);x.fillStyle='#697991';x.textAlign='center';x.fillText(days[i].slice(5),xx+bw/2,h-10)});x.textAlign='left'}function csv(key){let rows=data[key],headers=[...new Set(rows.flatMap(r=>Object.keys(r)))],txt=[headers.join(','),...rows.map(r=>headers.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download(txt,`maintenance_${key}_${today()}.csv`,'text/csv')}function download(s,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function backup(){download(JSON.stringify(data,null,2),'maintenance_backup_'+today()+'.json','application/json')}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.fleet||!d.oil)throw 0;data=d;save();render();toast('Backup restored')}catch(e){toast('Invalid backup file')}};r.readAsText(i.files[0])};i.click()}$('#exportAll').onclick=()=>{['fleet','jobs','oil','stock','checks'].forEach(csv)};$('#logout').onclick=logout;$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};window.onresize=drawChart;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
function hashPassword(password){return crypto&&crypto.subtle?crypto.subtle.digest('SHA-256',new TextEncoder().encode(password)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')):Promise.resolve('local-'+btoa(unescape(encodeURIComponent(password))))}
function saveUsers(){localStorage.setItem('maintenance_users',JSON.stringify(users))}
function authForm(firstRun=false){const box=$('#authContent');if(firstRun){box.innerHTML=`<h3>Create the first Administrator</h3><p>This account will manage members and app records on this browser.</p><form id="setupForm"><div class="field"><label>Full name</label><input name="name" required autocomplete="name" placeholder="Your full name"></div><div class="field"><label>Username</label><input name="username" required autocomplete="username" placeholder="Choose a username"></div><div class="field"><label>Password (at least 8 characters)</label><input name="password" required minlength="8" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input name="confirm" required minlength="8" type="password" autocomplete="new-password"></div><div class="authmsg">Keep your username and password safe. This local starter version does not sync accounts to other devices.</div><button class="primary">Create Administrator</button></form>`;$('#setupForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),username=f.get('username').trim().toLowerCase(),password=f.get('password');if(password!==f.get('confirm'))return toast('Passwords do not match');if(password.length<8)return toast('Use at least 8 characters');let hash=await hashPassword(password),u={id:id(),name,username,passwordHash:hash,role:'Administrator',created:today()};users.push(u);saveUsers();signIn(u);};}else{box.innerHTML=`<h3>Welcome back</h3><p>Sign in to access your maintenance records.</p><form id="loginForm"><div class="field"><label>Username</label><input name="username" required autocomplete="username" autofocus></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary">Sign in</button></form><div class="authmsg">Forgot your password? Ask your Administrator to create a new account or reset access on this device.</div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),username=f.get('username').trim().toLowerCase(),hash=await hashPassword(f.get('password')),u=users.find(x=>x.username===username&&x.passwordHash===hash);if(!u){toast('Incorrect username or password');return}signIn(u)};}}
function signIn(u){currentUser=u;role=u.role;$('#authScreen').classList.add('hidden');$('#userLabel').textContent=u.name+' • '+u.role;$('#membersNav').classList.toggle('hidden',role!=='Administrator');render();toast('Welcome, '+u.name)}
function logout(){currentUser=null;role='Viewer';$('#authScreen').classList.remove('hidden');authForm(false)}
function initAuth(){if(!users.length)authForm(true);else authForm(false);$('#membersNav').classList.add('hidden');$('#authScreen').classList.remove('hidden');}
function addMember(){if(role!=='Administrator')return toast('Only an Administrator can add members');$('#mtitle').textContent='Create user account';$('#mbody').innerHTML=`<form id="memberForm"><div class="formgrid"><div class="field"><label>Full name *</label><input name="name" required></div><div class="field"><label>Username *</label><input name="username" required></div><div class="field"><label>Role *</label><select name="role"><option>Maintenance Engineer</option><option>Workshop Supervisor</option><option>Mechanic</option><option>Storekeeper</option><option>Viewer</option><option>Administrator</option></select></div><div class="field"><label>Temporary password (8+ characters) *</label><input name="password" type="password" minlength="8" required></div></div><div class="actions"><button type="button" class="soft" id="cancelMember">Cancel</button><button class="primary">Create member</button></div></form>`;$('#back').classList.add('open');$('#cancelMember').onclick=close;$('#memberForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),username=f.get('username').trim().toLowerCase();if(users.some(u=>u.username===username))return toast('That username already exists');let u={id:id(),name:f.get('name').trim(),username,passwordHash:await hashPassword(f.get('password')),role:f.get('role'),created:today()};users.push(u);saveUsers();close();render();toast('Member account created')};}
function deleteMember(userId){if(role!=='Administrator')return toast('Only an Administrator can remove members');let u=users.find(x=>x.id===userId);if(!u)return;if(u.role==='Administrator'&&users.filter(x=>x.role==='Administrator').length===1)return toast('Keep at least one Administrator');if(!confirm('Delete account for '+u.name+'?'))return;users=users.filter(x=>x.id!==userId);saveUsers();render();toast('Member removed')}
initAuth();
</script></body></html>
